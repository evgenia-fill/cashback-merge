image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - validate
  - test

build:
  stage: build
  script:
    - dotnet build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_ID == "29223"
      when: always
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: never

linter:
  stage: validate
  script:
    - dotnet format --verify-no-changes
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_ID == "29223"
      when: always
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: never

unit_test:
  stage: test
  needs:
    - job: build
  script:
    - dotnet test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_ID == "29223"
      when: always
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: never
